profiles:
  ESP32-S3-Zero-N8R8-M:
    fqbn: esp32:esp32:esp32s3:UploadSpeed=921600,USBMode=hwcdc,CDCOnBoot=cdc,MSCOnBoot=default,DFUOnBoot=default,UploadMode=default,CPUFreq=240,FlashMode=qio,FlashSize=8M,PartitionScheme=default_8MB,DebugLevel=none,PSRAM=opi,LoopCore=1,EventsCore=1,EraseFlash=none,JTAGAdapter=default,ZigbeeMode=default
    platforms:
      - platform: esp32:esp32 (3.3.12)
        platform_index_url: https://raw.githubusercontent.com/espressif/arduino-esp32/gh-pages/package_esp32_index.json
    libraries:
      - Adafruit NeoPixel (1.15.5)
      - PubSubClient (2.8.0)
      - PicoSyslog (1.1.0)
      - ArduinoJson (7.4.3)
      - UniversalTelegramBot (1.3.0)
      - SSD1306wire (2.0.1)
      - BH1750 (1.3.0)
      - Adafruit BMP085 Library (1.2.4)
      - DHT sensor library (1.4.7)
      - ESP8266 Weather Station (2.3.0)
      - ESP8266 and ESP32 OLED driver for SSD1306 displays (4.6.2)
      - Json Streaming Parser (1.0.5)
      - Adafruit Unified Sensor (1.1.15)
      - Adafruit BusIO (1.17.4)
    programmer: ""
    port_config:
      baudrate: "115200"
      lineEnding: "\r\n"
      bits: "8"
      parity: none
      stop_bits: "1"
    port: /dev/ttyACM0
    notes: Gastnetwerk -> PiVPN
default_profile: ESP32-S3-Zero-N8R8-M
